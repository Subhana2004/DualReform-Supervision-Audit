name: Audit infrastructure
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-audit-lock.txt
      - run: python -m pytest -q
      - run: ruff check src scripts paper_reimplementation tests
      - run: python scripts/validate_notebook.py
